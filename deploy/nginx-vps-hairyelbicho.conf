# VPS host nginx — NO toca taxidriver.conf ni el default_server de arkadium.
# Proxy al contenedor hairypetshop-web (127.0.0.1:8090).
# Tras apuntar DNS a este VPS: certbot --nginx -d hairyelbicho.com -d www.hairyelbicho.com

server {
    listen 80;
    listen [::]:80;
    server_name hairyelbicho.com www.hairyelbicho.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
