# HairyPetShop — SPA + API propia. No usa el default_server de AutomaDrive (:80).
# LAN: http://192.168.1.167:8090
# Público: túnel Cloudflare → este vhost.

server {
    listen 8090;
    listen [::]:8090;
    server_name hairyelbicho.com www.hairyelbicho.com 192.168.1.167 hairypi.local _;

    root /home/hairy/apps/HairyPetShop/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
